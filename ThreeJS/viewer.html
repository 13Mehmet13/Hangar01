<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Nu.D36 - three.js Görüntüleyici</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; font-family: sans-serif; }
  #info { position: absolute; top: 10px; left: 12px; color: #ddd; z-index: 10; font-size: 14px; }
</style>
</head>
<body>
<div id="info">Nu.D36 — Hangar 01 (BMU1421) — fare ile sürükle: döndür, tekerlek: yakınlaş</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f24);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(8, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.2);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 2.5);
dir.position.set(-5, 8, 6);
scene.add(dir);

const grid = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;

new GLTFLoader().load('Nu_D36.glb', (gltf) => {
  scene.add(gltf.scene);
}, undefined, (err) => {
  document.getElementById('info').textContent = 'Model yuklenemedi: ' + err;
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
